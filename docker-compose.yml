services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: taskforge
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: taskforge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6380:6379"

  # For manually poking at the storage feature locally without touching real
  # DO Spaces - automated tests spin up their own ephemeral LocalStack via
  # Testcontainers instead and never use this one. Same pinned 3.8 image as
  # the tests (see TaskAttachmentControllerTest for why MinIO and newer
  # LocalStack tags are out).
  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: s3
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack

volumes:
  postgres-data:
  localstack-data:
