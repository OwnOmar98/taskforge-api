services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: taskforge
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: taskforge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # For manually poking at the storage feature locally without touching real
  # DO Spaces - automated tests spin up their own ephemeral MinIO via
  # Testcontainers instead and never use this one.
  minio:
    # Docker Hub withdrew minio/minio in 2026; MinIO now publishes only to quay.io.
    image: quay.io/minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
