name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Fails fast, before paying for the much slower Testcontainers suite: runs
  # the raw migration files directly against a brand-new database via the
  # Flyway CLI (mvn flyway:migrate), independent of the app's own Flyway
  # autoconfiguration. That's a genuinely different check from "the test
  # suite passed" - migrations are append-only in principle, so this is what
  # catches someone having edited an already-shipped one (a checksum
  # mismatch) or a new one that doesn't apply cleanly, before either ever
  # reaches main.
  migrate:
    name: Verify migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskforge
          POSTGRES_PASSWORD: taskforge
          POSTGRES_DB: taskforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Migrate a clean database
        run: >-
          ./mvnw -B flyway:migrate
          -Dflyway.url=jdbc:postgresql://localhost:5432/taskforge
          -Dflyway.user=taskforge
          -Dflyway.password=taskforge

  test:
    name: Build and test
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # No services: block here - the suite manages its own Postgres/Redis/
      # MinIO containers per test class via Testcontainers, using the Docker
      # daemon already present on this runner.
      - name: Run the test suite
        run: ./mvnw -B verify

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t taskforge-api:${{ github.sha }} .
