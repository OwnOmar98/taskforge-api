logging:
  structured:
    format:
      # JSON logs for log-aggregation tooling in prod; dev/test keep the
      # default human-readable console format, which is easier to read while
      # actively working. MDC entries (correlationId included) are included
      # automatically under the format's context fields.
      console: ecs

management:
  server:
    # A different port, not exposed by the public-facing load balancer -
    # the real security boundary is network isolation, not the SecurityConfig
    # permitAll rule (which still applies here but stops mattering once the
    # port itself isn't reachable from outside).
    port: ${MANAGEMENT_PORT:8081}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskforge}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

app:
  encryption-key: ${APP_ENCRYPTION_KEY}
  jwt:
    secret: ${APP_JWT_SECRET}
  storage:
    endpoint: ${DO_SPACES_ENDPOINT}
    region: ${DO_SPACES_REGION}
    bucket: ${DO_SPACES_BUCKET}
    access-key: ${DO_SPACES_KEY}
    secret-key: ${DO_SPACES_SECRET}
    force-path-style: false
