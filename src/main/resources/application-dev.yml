spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/taskforge
    username: taskforge
    password: taskforge
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org.hibernate.SQL: debug

app:
  # Dev-only AES-256 key (base64, 32 raw bytes) - never the prod key.
  encryption-key: sMacSJunt2+gyHiZB1u2UBIaWx/nTPMrieSHUs+8bHM=
  jwt:
    secret: dev-only-jwt-signing-secret-do-not-use-in-prod-0123456789
  storage:
    # Real DO Spaces, but a dev-only bucket and a dev-scoped key/secret - never
    # the prod deploy credential.
    endpoint: ${DO_SPACES_ENDPOINT}
    region: ${DO_SPACES_REGION}
    bucket: ${DO_SPACES_BUCKET}
    access-key: ${DO_SPACES_KEY}
    secret-key: ${DO_SPACES_SECRET}
    force-path-style: false
