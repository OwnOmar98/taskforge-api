spring:
  application:
    name: taskforge-api
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  # Stop accepting new requests but let in-flight ones finish (up to the
  # timeout above) instead of cutting them off mid-response - the executors
  # in AsyncConfig are given the same courtesy for in-flight async work.
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # Deliberately not the auto-configured default (health only) or a
        # blanket "*" (which would include env/beans/configprops - real
        # information disclosure). These four are the ones an operator or a
        # scraper actually needs; everything else stays unexposed regardless
        # of network reachability.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        # Only the app's own liveness/readiness state plus the dependencies
        # that genuinely block serving traffic (DB, cache). webhookDelivery
        # is deliberately excluded here - an open circuit breaker for one
        # org's webhook means that delivery is degraded, not that this pod
        # is unfit to receive traffic, so it must never fail a readiness
        # probe and take a healthy instance out of rotation.
        readiness:
          include: readinessState,db,redis
        liveness:
          include: livenessState

resilience4j:
  # "configs.default" (a config template), not "instances.webhook" (one
  # literal named instance): WebhookSender resolves a per-organization
  # instance name at runtime (registries can't be pre-populated with a name
  # that doesn't exist until a webhook for that org is actually sent), and
  # any instance a registry creates on first use with no matching
  # instances.<name> block falls back to this default template.
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
        # Retrying a call the circuit breaker already refused would just
        # waste attempts without ever reaching the real endpoint - once it's
        # open, that's the signal to stop, not something to retry past.
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    configs:
      default:
        timeout-duration: 5s

app:
  # Hibernate scans every @Converter unconditionally while building JPA
  # metadata, even in a lightweight @DataJpaTest slice that never touches an
  # encrypted column - so EncryptedStringConverter needs some value here in
  # every context, not just ones with a profile active. Not a real secret:
  # every environment that actually stores encrypted data (dev/test/prod)
  # overrides it in its own profile-specific config.
  encryption-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  jwt:
    access-token-ttl: 15m
  refresh-token:
    ttl: 30d
  invitation:
    ttl: 7d
  # Per-IP, protects the /login endpoint itself from abuse regardless of
  # which account is targeted.
  rate-limit:
    login:
      max-attempts: 10
      window: 1m
      # Off by default - see RateLimitProperties for why. Deployments behind
      # a reverse proxy that's actually configured to overwrite/strip a
      # client-supplied X-Forwarded-For should override this to true in
      # their own environment config, not here.
      trust-forwarded-for: false
  # Per-account, protects one target from credential stuffing distributed
  # across many source IPs - complements, doesn't duplicate, the rate limit.
  login-lockout:
    max-failures: 5
    lockout-duration: 15m
  notification:
    overdue-digest:
      # How many overdue tasks OverdueTaskDigestJob pulls into memory per
      # database round trip, bounding the job's memory use regardless of how
      # many are overdue across every organization on a given day.
      page-size: 500
  # GET /api/v1/events/stream (Server-Sent Events).
  realtime:
    # Comfortably under the ~60s idle timeout common to proxies and load
    # balancers, which would otherwise silently cut a quiet stream.
    heartbeat-interval: 25s
    # Each open stream holds a servlet async request for its whole lifetime;
    # a handful covers several tabs/devices without letting one account hold
    # an unbounded number.
    max-connections-per-user: 5
    # Past this many missed notifications, a reconnecting client is told to
    # resync from GET /notifications rather than replaying the backlog down
    # the stream.
    replay-limit: 100
  # No frontend origin exists for this project yet; left empty (not a
  # wildcard) so cross-origin browser access stays denied by default.
  cors:
    allowed-origins: []
  storage:
    presigned-url-ttl: 10m
    max-file-size-bytes: 20971520 # 20MB
    allowed-content-types:
      - image/png
      - image/jpeg
      - image/gif
      - application/pdf
      - text/plain
      - application/zip
