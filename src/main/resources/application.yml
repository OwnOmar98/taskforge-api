spring:
  application:
    name: taskforge-api
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  jwt:
    access-token-ttl: 15m
  refresh-token:
    ttl: 30d
  invitation:
    ttl: 7d
  storage:
    presigned-url-ttl: 10m
    max-file-size-bytes: 20971520 # 20MB
    allowed-content-types:
      - image/png
      - image/jpeg
      - image/gif
      - application/pdf
      - text/plain
      - application/zip
